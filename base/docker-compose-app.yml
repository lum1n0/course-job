# docker-compose-app.yml
# Полный стек приложения: Backend + PostgreSQL + MongoDB + Ollama + Redis

version: '3.9'

services:
  # ===========================================
  # BACKEND (Spring Boot Application)
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_USERNAME: postgres
      DB_PASSWORD: 12345
      # JWT
      JWT_SECRET: ${JWT_SECRET:-my-super-secret-jwt-key-change-in-production}
      # File uploads
      FILE_UPLOAD_DIR: /app/uploads
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017/knowledge
      # LDAP (опционально, укажите свои значения)
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================
  # PostgreSQL with pgvector (имя db для совместимости с prod)
  # ===========================================
  db:
    image: pgvector/pgvector:pg17-bookworm
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5132:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # MongoDB
  # ===========================================
  mongo:
    image: mongo:7
    container_name: knowledge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - knowledge-network

  # ===========================================
  # Ollama (LLM Service)
  # ===========================================
  ollama:
    build: ./ollama-init
    container_name: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - knowledge-network

  # ===========================================
  # Redis (для кэширования и сессий)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - knowledge-network
    command: redis-server --appendonly yes

# ===========================================
# Networks
# ===========================================
networks:
  knowledge-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
  mongo_data:
  ollama_data:
  redis_data:
  uploads_data:
