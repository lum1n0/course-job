<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pro Znania API Documentation</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui-bundle.css" />
    <link rel="stylesheet" type="text/css" href="./swagger-ui-standalone-preset.css" />
    <link rel="stylesheet" type="text/css" href="custom.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>

<body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js" crossorigin></script>
    <script src="./swagger-ui-standalone-preset.js" crossorigin></script>
    <script src="custom.js" crossorigin></script>
    
    <script>
        window.onload = function() {
            // Инициализация Swagger UI
            const ui = SwaggerUIBundle({
                url: './v3/api-docs',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                validatorUrl: null, // Отключаем проверку спецификации
                docExpansion: "list", // Разворачивать список по умолчанию
                defaultModelsExpandDepth: 1, // Глубина разворачивания моделей
                defaultModelExpandDepth: 1, // Глубина разворачивания модели по умолчанию
                showExtensions: true, // Показывать расширения
                showCommonExtensions: true, // Показывать общие расширения
                tryItOutEnabled: true, // Включить кнопку "Try it out"
                oauth2RedirectUrl: window.location.origin + '/webjars/swagger-ui/index.html/oauth2-redirect.html'
            });

            // Добавляем кастомное поведение после инициализации
            window.ui = ui;
        };
    </script>
</body>
</html>
